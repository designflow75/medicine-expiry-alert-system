# ==============================================================================
# MediGuard - Database Configuration
# Supports: Supabase (Cloud PostgreSQL) & Local MySQL
# ==============================================================================

# Database Engine Selection:
# Set to 'supabase' (or 'postgresql') for Supabase Cloud Database.
# Set to 'mysql' to use local MySQL (e.g. XAMPP/WAMP/MySQL Workbench).
db.type=supabase

# ------------------------------------------------------------------------------
# 1. Supabase (Cloud PostgreSQL) Configuration
# ------------------------------------------------------------------------------
# Host: IPv4-compatible pooler host from your Supabase Dashboard
#       (Project Settings -> Database -> Connection Pooling -> Host)
# User format: postgres.<project_ref> (e.g. postgres.ahfygicztfdszpxtohsg)
# Port: 5432 (Session mode) or 6543 (Transaction mode)
# Database: postgres
# SSL: true
# ------------------------------------------------------------------------------
db.host=aws-0-ap-southeast-1.pooler.supabase.com
db.port=5432
db.name=postgres
db.user=postgres.ahfygicztfdszpxtohsg
db.password=YOUR_SUPABASE_DB_PASSWORD
db.ssl=true

# (Optional) Direct JDBC URL:
# If you prefer pasting the entire JDBC connection URI directly from Supabase,
# uncomment and provide it below:
# db.url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?user=postgres.ahfygicztfdszpxtohsg&password=YOUR_PASSWORD&sslmode=require

# ------------------------------------------------------------------------------
# 2. Local MySQL Configuration (Alternative / Fallback)
# ------------------------------------------------------------------------------
# To switch to local MySQL, change db.type=supabase above.
# The application will then use the following MySQL settings:
db.mysql.host=localhost
db.mysql.port=3306
db.mysql.name=medicine_expiry_db
db.mysql.user=root
db.mysql.password=CampusOne@2026!
